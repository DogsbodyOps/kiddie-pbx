---
# Copy to group_vars/asterisk/vault.yml and encrypt it:
#   ansible-vault encrypt group_vars/asterisk/vault.yml
# That path is gitignored because this repo is public. Keep a copy somewhere safe.
#
# The first digit of each number sets the caller's ring category in extensions.conf:
# 1 sibling, 2 parent, 3 grandparent.
#
# The Cloudflare token is used by certbot to prove ownership of the domain. Give it
# only Zone:DNS:Edit permission on this zone.
vault_cloudflare_dns_api_token: CHANGE_ME
vault_asterisk_extensions:
  - number: "101"
    name: Indigo
    password: CHANGE_ME
  - number: "102"
    name: Lyla
    password: CHANGE_ME
  - number: "201"
    name: Nana Shell
    password: CHANGE_ME
