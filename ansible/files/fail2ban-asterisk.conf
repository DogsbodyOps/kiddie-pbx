# Deliberately aggressive. Everyone on a home's public IP shares a ban, so one phone with a wrong
# password can cut off that whole home. To lift a ban:
#   sudo fail2ban-client set asterisk unbanip <ip>

[asterisk]
enabled = true
filter = asterisk

# Ubuntu defaults to the systemd journal, which would never see this log file.
backend = polling
logpath = /var/log/asterisk/security.log

# Three failures in a day gets a one-week ban, doubling for repeat offenders up to a year.
maxretry = 3
findtime = 1d
bantime = 1w
bantime.increment = true
bantime.factor = 2
bantime.maxtime = 52w

# SIP and call audio only, on TCP and UDP. SSH stays open so a banned home can still be unbanned
# from it.
banaction = nftables[type=multiport]
port = 5061,10000:10199
