; ============================================================================
; extensions.conf — Kids' Intercom Dialplan
; ============================================================================
; DESIGN NOTE: we use ONE pattern-matching rule (_1XX) rather than one
; "exten =>" line per extension. That means this file never needs to change
; when you add a new extension in pjsip.conf — the pattern already matches
; any 3-digit number starting with 1. This is the dialplan equivalent of the
; templating we did in pjsip.conf: define the behaviour once, let the number
; range fall out of it.
;
; Pattern syntax refresher:
;   X = any single digit 0-9
;   _1XX = a number starting with 1, followed by exactly 2 more digits
;          i.e. matches 100-199
; ============================================================================


; ----------------------------------------------------------------------------
; [internal] — this is the context every kid's endpoint uses (see
; "context=internal" in pjsip.conf). Calls FROM any extension land here.
; ----------------------------------------------------------------------------
[internal]

; Rule: dialling any 3-digit extension (100-999) rings that extension
; directly. Widened from _1XX to _XXX because we now reserve MULTIPLE
; ranges for different categories of caller (see block comment above) —
; this single rule handles all of them, today and as new ranges fill up.
exten => _XXX,1,NoOp(Call from ${CALLERID(num)} to ${EXTEN})
    ; ${EXTEN} = the number that was actually dialled (e.g. "101")
    ; ${CALLERID(num)} = the extension that placed the call
    ; NoOp just logs this to the console/CLI — invaluable for debugging,
    ; costs nothing, always leave one at the top of a new call flow while
    ; you're testing it.

 same => n,Set(CALLER_CATEGORY=${CALLERID(num):0:1})
    ; ${VAR:0:1} = string-slice syntax, takes 1 character starting at
    ; offset 0 — i.e. the FIRST digit of the caller's extension.
    ; This is what maps "who's calling" to "which range they're in"
    ; without needing to list every individual extension number.

 same => n,GotoIf($["${CALLER_CATEGORY}" = "1"]?ring_sibling)
 same => n,GotoIf($["${CALLER_CATEGORY}" = "2"]?ring_parent)
 same => n,GotoIf($["${CALLER_CATEGORY}" = "3"]?ring_grandparent)
 same => n,Goto(ring_default)
    ; Falls through here if the caller's first digit doesn't match any
    ; known range — e.g. if you add a "4XX" category later and forget
    ; to add a GotoIf for it. Better than silently applying the wrong tone.

 same => n(ring_sibling),Set(PJSIP_HEADER(add,Alert-Info)=family-sibling)
 same => n,Goto(do_dial)

 same => n(ring_parent),Set(PJSIP_HEADER(add,Alert-Info)=family-parent)
 same => n,Goto(do_dial)

 same => n(ring_grandparent),Set(PJSIP_HEADER(add,Alert-Info)=family-grandparent)
 same => n,Goto(do_dial)

 same => n(ring_default),Set(PJSIP_HEADER(add,Alert-Info)=family-default)
    ; PJSIP_HEADER(add,Alert-Info)=<value> adds that header to the
    ; OUTGOING INVITE on the leg we're about to create with Dial() below.
    ; The receiving phone reads this header and — if you've configured a
    ; matching Distinctive Ring Tone rule on it — plays a different tone.
    ; No rule configured on a given phone just means it falls back to
    ; that phone's normal ring, so this is always safe to send.

 same => n(do_dial),Dial(PJSIP/${EXTEN},20)
    ; Dial the endpoint whose name matches the number dialled.
    ; PJSIP/101 means "ring whatever device is registered as endpoint 101".
    ; "20" = ring for 20 seconds before giving up — short, appropriate for
    ; kids who won't wait around, adjust if you want longer.

 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy:noanswer)
    ; ${DIALSTATUS} is set automatically after Dial() finishes and tells you
    ; why the call ended (ANSWER, BUSY, NOANSWER, CONGESTION, CHANFAILED...).
    ; We branch on it so busy vs. no-answer can play different feedback —
    ; small touch, but noticeably nicer for kids trying to understand why
    ; a call didn't connect.

 same => n(busy),Busy(5)
    ; Play busy tone for 5 seconds then hang up.

 same => n,Hangup()

 same => n(noanswer),Congestion(5)
    ; "Congestion" here is being (ab)used as a generic "didn't connect" tone
    ; distinct from busy — covers NOANSWER, CHANFAILED, CANCEL, etc.

 same => n,Hangup()

; Safety net: anything dialled that ISN'T a valid 3-digit 1XX extension.
; Without this, a mis-dial just silently fails — this at least gives
; audible feedback so a kid knows they mistyped rather than the app
; "doing nothing".
exten => i,1,NoOp(Invalid extension dialled)
 same => n,Playback(pbx-invalid)
 same => n,Hangup()

exten => t,1,NoOp(Dial timeout - no digits entered)
 same => n,Hangup()

; Test hello-world extension
exten = 900,1,Answer()
same = n,Wait(1)
same = n,Playback(hello-world)
same = n,Hangup()
